[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nanotransformer"
version = "0.1.0"
description = "A Llama/GPT-style autoregressive Transformer built from scratch in PyTorch with BPE, RMSNorm, RoPE, GQA, KV-Cache, and SwiGLU"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]
